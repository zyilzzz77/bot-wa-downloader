services:
  botgodownloader:
    build: .
    container_name: botgodownloader
    restart: unless-stopped
    environment:
      - NEOXR_API_KEY=${NEOXR_API_KEY}
      - PHONE_NUMBER=${PHONE_NUMBER}
      - TZ=Asia/Jakarta
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true
    stop_grace_period: 10s
